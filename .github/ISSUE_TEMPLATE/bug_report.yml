name: "🐞 Bug Report (Beta)"
description: "Report a reproducible bug, crash, or unexpected behavior encountered in the beta app"
title: "[Bug]: "
labels: ["bug", "beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping test HustleHub Beta! Please provide as much detail as possible to help us triage and fix the issue quickly.

  - type: dropdown
    id: severity
    attributes:
      label: Severity Level
      description: "How severely does this affect app usage?"
      options:
        - "Critical (App crashes on launch, payment failure, core auth/order failure)"
        - "Major (Key feature broken or unresponsive, but workaround exists)"
        - "Minor (Visual defect, formatting issue, typo, minor latency)"
    validations:
      required: true

  - type: dropdown
    id: flow
    attributes:
      label: Affected Area / Flow
      options:
        - "Authentication / Onboarding"
        - "Service Discovery / Search"
        - "Service Creation / Editing"
        - "Chat / Messaging"
        - "Reviews / Ratings"
        - "Profile / Settings"
        - "Payments / Transactions"
        - "Push Notifications"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: "A clear and concise description of what happened."
      placeholder: "When tapping on 'Publish Service', the app freezes and closes."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step instructions on how to trigger the bug."
      value: |
        1. Open the app and navigate to '...'
        2. Tap on '...'
        3. Enter '...'
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: "What did you expect to happen vs what actually occurred?"
      placeholder: "Expected: Service is published. Actual: Error dialog shown."
    validations:
      required: true

  - type: input
    id: device_info
    attributes:
      label: Device & OS Information
      description: "Phone brand, model, and Android version (e.g., Tecno Spark 10, Android 13, Samsung Galaxy S21, Android 14)."
      placeholder: "Tecno Camon 20, Android 13"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version
      description: "Beta build version displayed in Profile > Settings (e.g., 1.0-beta)."
      placeholder: "1.0-beta"
    validations:
      required: true

  - type: textarea
    id: logs_screenshots
    attributes:
      label: Screenshots / Screen Recording / Logs
      description: "Drag and drop any relevant screenshots or error logs."
    validations:
      required: false
