name: Code Quality & Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  code-quality:
    name: Code Quality Checks & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keys.properties
        run: |
          cp keys.properties.template keys.properties
          sed -i 's|=.*|=DUMMY_CI_VALUE|g' keys.properties

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run Code Quality Checks (ktlint & detekt)
        run: ./gradlew ktlintCheck detekt --no-daemon

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon
