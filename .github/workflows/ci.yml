name: Code Quality & Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  code-quality:
    name: Code Quality Checks & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keys.properties
        run: |
          cp keys.properties.template keys.properties
          sed -i 's|=.*|=DUMMY_CI_VALUE|g' keys.properties

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create mock google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "123", "project_id": "mock-project" },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123:android:abc",
                  "android_client_info": { "package_name": "must.kdroiders.hustlehub" }
                },
                "api_key": [{ "current_key": "mock-key" }]
              }
            ]
          }
          EOF

      - name: Run Code Quality Checks (ktlint & detekt)
        run: ./gradlew ktlintCheck detekt --no-daemon

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon
